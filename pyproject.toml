[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-portfolio"
version = "0.1.0"
description = "A reproducible sales-data analysis portfolio project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
